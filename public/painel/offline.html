<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A URL do painel é secreta. Esta tela é servida sob ela pelo Service
         Worker, então repete a proteção da rota. O `next.config.ts` já aplica
         `X-Robots-Tag` a `/painel/:token*`; a meta cobre o arquivo também quando
         ele é lido do cache, onde não há header nenhum. -->
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Painel — Casa Louzada</title>
    <style>
      /* Os três valores repetem os tokens de `src/app/globals.css`
         (`--color-fundo`, `--color-texto`, `--color-texto-secundario`). São
         literais de propósito: esta tela precisa desenhar sem nenhuma folha
         externa, porque ela existe justamente quando a aplicação não responde. */
      :root {
        --fundo: #544c3f;
        --texto: #f1efea;
        --secundario: #bdb5a6;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--fundo);
        color: var(--texto);
        /* A Jost mora no bundle do Next, que aqui pode não ter carregado. Sem
           `@font-face` e sem fonte externa: a pilha do sistema é o que sempre
           existe, e esta tela não compete com a tipografia do painel. */
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Mesma disciplina do painel: a TV não tem operador, e um ponteiro
           parado no meio da tela ficaria lá o dia inteiro. */
        cursor: none;
        overflow: hidden;
      }

      /* Nenhuma dimensão estrutural em px — tudo relativo à viewport, para a
         mesma tela servir ao monitor de conferência e à TV de 80" em 4K. */
      .painel {
        text-align: center;
        padding: 0 6vw;
        max-width: 100%;
      }

      .marca {
        width: 26vw;
        max-width: 60vh;
        height: auto;
        display: block;
        margin: 0 auto 6vh;
      }

      .titulo {
        font-size: 3.2vw;
        font-weight: 300;
        letter-spacing: 0.02em;
        line-height: 1.2;
      }

      .subtitulo {
        margin-top: 2.5vh;
        font-size: 1.6vw;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--secundario);
      }

      /* Sinal de vida discreto: mostra que a tela está tentando, sem virar
         animação chamativa numa parede que fica ligada o dia inteiro. */
      .pulso {
        display: inline-block;
        width: 0.6vw;
        height: 0.6vw;
        min-width: 0.35vh;
        min-height: 0.35vh;
        margin-right: 0.8vw;
        border-radius: 50%;
        background: var(--secundario);
        vertical-align: middle;
        animation: respirar 2.4s ease-in-out infinite;
      }

      @keyframes respirar {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulso {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <main class="painel">
      <!-- O mesmo arquivo oficial que o painel usa (DEC-047), pré-carregado pelo
           Service Worker para existir mesmo sem rede. -->
      <img
        class="marca"
        src="/marca/casa-louzada-horizontal-claro.png"
        alt="Casa Louzada"
        width="2511"
        height="297"
      />
      <h1 class="titulo">Painel temporariamente indisponível</h1>
      <p class="subtitulo"><span class="pulso"></span>Reconectando automaticamente</p>
    </main>

    <script>
      // Nenhum número, nenhum nome e nenhum horário aparecem aqui, e nada é lido
      // de storage: esta tela não guarda estado do painel (DEC-048). Ela só
      // pergunta, de tempos em tempos, se a aplicação voltou.
      (function () {
        "use strict";

        /** Uma tentativa a cada 15s. */
        var INTERVALO_MS = 15000;
        /** Curto o bastante para a tentativa nunca alcançar a seguinte. */
        var LIMITE_MS = 10000;

        var emVoo = false;

        function tentar() {
          if (emVoo) return;
          emVoo = true;

          var controle = new AbortController();
          var expirou = setTimeout(function () {
            controle.abort();
          }, LIMITE_MS);

          // A URL atual continua sendo a do painel — o Service Worker devolveu
          // este documento sem trocar a barra de endereços. Esta requisição não
          // é uma navegação, então passa direto pelo SW e vai à rede de verdade.
          fetch(window.location.href, {
            cache: "no-store",
            credentials: "same-origin",
            signal: controle.signal,
          })
            .then(function (resposta) {
              // Deliberado: qualquer resposta de rede abaixo de 500 significa que
              // a aplicação respondeu, e a verdade dela é melhor que esta tela.
              // 200 volta ao painel; 404 de token inválido mostra o 404 real
              // (DEC-010). Só 5xx continua sendo indisponibilidade.
              if (resposta.status < 500) window.location.reload();
            })
            .catch(function () {
              // Rede fora, timeout ou abort: segue na tela institucional.
            })
            .then(function () {
              clearTimeout(expirou);
              emVoo = false;
            });
        }

        setInterval(tentar, INTERVALO_MS);
        window.addEventListener("online", tentar);
      })();
    </script>
  </body>
</html>
